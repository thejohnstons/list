<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B2230"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Our List">
<title>Our List</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Yellowtail&family=Courier+Prime:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--paper:#F5F1EA;--card:#FFFFFF;--ink:#4A1622;--muted:#8C6B70;--line:#E9DED6;--wine:#6B2230;--pink:#F2A0C0;--blush:#F9D5DD;--terra:#E8613F;--apricot:#F9A65A;--sage:#5E8F78;--olive:#8C8F3C;--peri:#8E9CE0;--butter:#E9DD7C;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--paper:#231417;--card:#2E1B20;--ink:#F9E6EA;--muted:#C9A9B0;--line:#43292F}}
:root[data-theme="dark"]{color-scheme:dark;--paper:#231417;--card:#2E1B20;--ink:#F9E6EA;--muted:#C9A9B0;--line:#43292F}
*{box-sizing:border-box} [hidden]{display:none!important} html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--wine);z-index:30}
button,input,select,textarea{font:inherit;color:inherit} button{cursor:pointer} :focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* top band */
.band{background:var(--wine);color:var(--blush)}
.band .in{max-width:1120px;margin:0 auto;padding:14px 20px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back-dash{font-family:'Courier Prime',monospace;font-size:13px;color:var(--blush);text-decoration:none;opacity:.85}
.logo{margin:0;line-height:1;display:flex;align-items:baseline;gap:8px;font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-weight:800;font-size:clamp(30px,6vw,44px);letter-spacing:-.01em;color:var(--pink);text-transform:uppercase}
.logo span{font-family:'Yellowtail',cursive;text-transform:none;font-weight:400;font-size:1.1em;color:var(--blush)}
.tag{font-family:'Courier Prime',monospace;font-size:12.5px;opacity:.85;margin:4px 0 0}
main{max-width:1120px;margin:0 auto;padding:18px 20px 60px}
/* home: website layout on wide screens, one column on phones */
.home{display:grid;gap:22px}
@media (min-width:900px){.home{grid-template-columns:minmax(0,1fr) 300px;align-items:start}.home .side{position:sticky;top:16px}}
.hello{font-family:'Courier Prime',monospace;font-size:14px;color:var(--muted);margin:0 0 4px}
.sum{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-weight:800;font-size:clamp(24px,4vw,32px);margin:0 0 14px;line-height:1.1}
.quick{display:flex;gap:8px;margin:0 0 12px}
.quick input,.quick select{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;background:var(--card)}
.quick select{flex:0 0 auto}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;background:var(--wine);color:var(--blush);font-size:15px}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.link{border:0;background:none;color:var(--terra);font-weight:700;font-size:14px;padding:0}
.sec{font-family:'Courier Prime',monospace;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (min-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border:0;border-radius:6px;min-height:128px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:var(--wine);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile b{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:20px;font-weight:800;line-height:1.05}
.tile .tc{font-family:'Courier Prime',monospace;font-size:12.5px}
.tile .te{font-size:22px}
.tile .lock{position:absolute;top:12px;right:12px;font-size:13px}
.c-pink{background:var(--pink)} .c-blush{background:var(--blush)} .c-terra{background:var(--terra);color:#fff} .c-apricot{background:var(--apricot)} .c-sage{background:var(--sage);color:#F3EAC2} .c-wine{background:var(--wine);color:var(--pink)} .c-peri{background:var(--peri);color:#2A1830}
.shops{display:flex;flex-wrap:wrap;gap:8px}
.shopchip{border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:600;background:var(--card);font-size:14px}
.shopchip.has{border-color:var(--wine)} .shopchip span{background:var(--wine);color:var(--blush);border-radius:999px;padding:1px 7px;font-size:12px;margin-left:4px}
.staples{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.pill{flex:none;border:0;border-radius:999px;padding:6px 11px;font-weight:600;font-size:13.5px;background:var(--blush);color:var(--wine)}
.pill[aria-pressed="true"]{background:var(--wine);color:var(--blush)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:13px;color:var(--muted)} .empty{color:var(--muted);text-align:center;padding:24px 0}
.panel{background:var(--card);border-radius:8px;padding:16px;border:1px solid var(--line)}
/* list pages */
.bar{display:flex;justify-content:space-between;margin:0 0 12px}
.back{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700}
.lhead{border-radius:6px;padding:20px;display:flex;gap:14px;align-items:center}
.lhead .te{font-size:28px}
.lhead h1{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0;font-size:clamp(26px,4vw,34px);line-height:1;font-weight:800}
.lhead p{margin:4px 0 0;font-family:'Courier Prime',monospace;font-size:13px}
.secret{background:var(--blush);color:var(--wine);border-radius:6px;padding:10px 12px;font-weight:600;font-size:14px;margin:10px 0 0}
.groups{columns:1;column-gap:18px;margin-top:6px}
@media (min-width:900px){.groups{columns:2}}
.grp-wrap{break-inside:avoid;margin-bottom:6px}
.grp{font-family:'Courier Prime',monospace;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:flex;gap:8px;align-items:center}
.card{background:var(--card);border-radius:8px;padding:2px 14px;border:1px solid var(--line)} .card.dim{opacity:.7}
.row-i{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)} .row-i:last-child{border-bottom:0}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--wine);background:transparent;color:var(--blush);font-weight:900;font-size:13px;line-height:1}
.row-i.done .tick{background:var(--wine)} .row-i.done b{text-decoration:line-through;opacity:.55}
.it{border:0;background:none;text-align:left;padding:0} .it b{display:block;font-size:15.5px;font-weight:600} .it span{display:block;font-size:12.5px;color:var(--muted)} .it .nt{font-style:italic}
.lk{text-decoration:none;font-size:18px;padding:4px}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px} .sizes label{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--muted)}
.sizes input{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);font-size:16px;color:var(--ink);margin-top:3px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(74,22,34,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.sheet{align-items:center}.sheet .pnl{border-radius:10px!important}}
.sheet .pnl{background:var(--paper);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(28px + env(safe-area-inset-bottom,0px))}
.sheet .top{display:flex;justify-content:space-between;align-items:center} .sheet h2{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0;font-size:22px;font-weight:800}
#sheetClose{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700}
.l{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px;font-family:'Courier Prime',monospace}
.f{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:16px;background:var(--card);color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gate{min-height:70vh;display:grid;place-items:center;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--wine);color:var(--blush);padding:10px 16px;border-radius:999px;font-weight:700;z-index:90;pointer-events:none}
</style></head><body><header class="band"><div class="in"><div><h1 class="logo">Our <span>List</span></h1><p class="tag">Everything we need, in one place.</p></div><a class="back-dash" href="/">← Dashboard</a></div></header>
<main>
<div id="gate" class="gate" hidden><div><h1 class="logo" style="justify-content:center;color:var(--wine)">Our <span style="color:var(--terra)">List</span></h1><p class="note">Sign in with your family Google account.</p><button class="btn" id="signin" type="button">Sign in with Google</button><p class="note" id="gatemsg"></p></div></div>
<section id="v-home" hidden></section><section id="v-list" hidden></section><section id="v-shop" hidden></section><section id="v-sizes" hidden></section>
</main>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="pnl"><div class="top"><h2 id="sheetTitle"></h2><button type="button" id="sheetClose">Close</button></div><div id="sheetBody"></div></div></div>
<div id="toast" role="status" hidden></div>
<script src="/firebase-config.js"></script>
<script type="module" src="app.js"></script></body></html>
